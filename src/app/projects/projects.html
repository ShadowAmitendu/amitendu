<div class="min-h-screen py-8 px-4">
  <div class="max-w-7xl mx-auto">
    <!-- Header -->
    <div class="mb-12 text-center">
      <h1 class="text-5xl font-bold text-gray-900 dark:text-white mb-4">Projects</h1>
      <p class="text-lg text-gray-600 dark:text-gray-400">Discover amazing Software and Goodies</p>
    </div>

    <!-- Loading Spinner -->
    @if (loading) {
    <div class="flex justify-center items-center min-h-[400px]">
      <div class="relative">
        <div class="w-16 h-16 border-4 border-blue-200 dark:border-gray-700 rounded-full"></div>
        <div
          class="w-16 h-16 border-4 border-blue-600 dark:border-blue-500 rounded-full animate-spin border-t-transparent absolute top-0 left-0"
        ></div>
      </div>
    </div>
    }

    <!-- Grid Layout for Cards -->
    @if (!loading) {
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      @for (repo of repos; track repo.name) {
      <app-repo-card [repo]="repo"></app-repo-card>
      }
    </div>
    }
  </div>
</div>
